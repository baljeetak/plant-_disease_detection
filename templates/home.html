<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeafGuard | Plant Disease AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); }
        body { background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%); min-height: 100vh; }
        .drag-over { border-color: #10b981 !important; background-color: #ecfdf5 !important; }
    </style>
</head>
<body class="text-gray-800 font-sans">

    <nav class="p-6">
        <div class="max-w-6xl mx-auto">
            <h1 class="text-2xl font-bold text-green-700 flex items-center gap-2">
                <i class="fas fa-leaf"></i> LeafGuard AI
            </h1>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-6 py-10">
        <div class="text-center mb-12">
            <h2 class="text-4xl font-extrabold text-gray-900 mb-2">Plant Disease Scanner</h2>
            <p class="text-gray-600">Upload a leaf image to detect potential diseases.</p>
        </div>

        <div class="glass p-8 rounded-3xl shadow-xl mb-10">
            <form id="upload-form" action="/upload/" method="POST" enctype="multipart/form-data" class="space-y-6">
                
                <div id="drop-zone" class="flex flex-col items-center justify-center w-full h-64 border-2 border-green-300 border-dashed rounded-2xl cursor-pointer bg-green-50 hover:bg-green-100 transition-all">
                    <div id="drop-zone-content" class="flex flex-col items-center justify-center pt-5 pb-6">
                        <i class="fas fa-cloud-upload-alt text-4xl text-green-500 mb-4"></i>
                        <p class="mb-2 text-sm text-gray-500"><span class="font-semibold text-green-700">Click to upload</span> or drag and drop</p>
                        <p id="file-name-display" class="text-xs text-gray-400">PNG, JPG or JPEG</p>
                    </div>
                    <input id="file-input" type="file" name="img" class="hidden" accept="image/*" required />
                </div>

                <div id="preview-container" class="hidden flex flex-col items-center">
                    <img id="image-preview" src="#" alt="Preview" class="max-h-48 rounded-lg mb-4 shadow-md">
                </div>

                <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-4 rounded-xl transition-all shadow-lg transform hover:scale-[1.01] active:scale-[0.98]">
                    <i class="fas fa-microscope mr-2"></i> Run Prediction
                </button>
            </form>
        </div>

        {% if result %}
        <div class="glass rounded-3xl shadow-2xl overflow-hidden animate-bounce-short">
            <div class="md:flex">
                <div class="md:w-1/2">
                    <img src="{{ imagepath }}" class="h-full w-full object-cover max-h-80">
                </div>
                <div class="p-8 md:w-1/2 flex flex-col justify-center">
                    <div class="uppercase tracking-wide text-xs text-green-600 font-bold mb-1">AI Diagnosis</div>
                    <h3 class="text-2xl font-bold text-gray-900 mb-4">{{ prediction }}</h3>
                    <div class="bg-white border border-green-100 p-4 rounded-xl">
                        <p class="text-sm text-gray-600 italic">Scan complete. Check the predicted class against your plant variety.</p>
                    </div>
                    <a href="/" class="mt-6 text-green-700 font-medium hover:underline text-sm">
                        <i class="fas fa-redo-alt mr-1"></i> Scan another image
                    </a>
                </div>
            </div>
        </div>
        {% endif %}
    </main>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const fileNameDisplay = document.getElementById('file-name-display');
        const previewContainer = document.getElementById('preview-container');
        const imagePreview = document.getElementById('image-preview');

        // Handle Click on Zone
        dropZone.addEventListener('click', () => fileInput.click());

        // Visual Feedback for Dragging
        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => {
                e.preventDefault();
                dropZone.classList.add('drag-over');
            }, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => {
                e.preventDefault();
                dropZone.classList.remove('drag-over');
            }, false);
        });

        // Handle Dropped Files
        dropZone.addEventListener('drop', (e) => {
            const dt = e.dataTransfer;
            const files = dt.files;
            fileInput.files = files;
            handleFiles(files);
        });

        // Handle File Selection via Dialog
        fileInput.addEventListener('change', function() {
            handleFiles(this.files);
        });

        function handleFiles(files) {
            if (files.length > 0) {
                const file = files[0];
                fileNameDisplay.innerText = file.name;
                
                // Show Preview
                const reader = new FileReader();
                reader.onload = function(e) {
                    imagePreview.src = e.target.result;
                    previewContainer.classList.remove('hidden');
                }
                reader.readAsDataURL(file);
            }
        }
    </script>

</body>
</html>
